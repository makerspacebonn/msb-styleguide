<!doctype html><html lang="de"><head><meta charset="utf-8"><title>17 Emo: Handnotiz</title>
<!-- Emotionaler Post, nur Text + Logo. Kurze Handnotiz mit Pfeil direkt auf dem Foto (Caveat = Platzhalter für echte Handschrift). -->
<link rel="stylesheet" href="post.css">
<style>
.foto { position:absolute; inset:0; object-position:50% 40%; }
.notiz { position:absolute; left:640px; top:120px; width:400px; font-size:76px; line-height:1; color:var(--weiss); transform:rotate(-5deg); text-shadow:0 2px 12px rgba(30,28,25,.45); }
.pfeil { position:absolute; left:560px; top:300px; }
.unten { position:absolute; left:0; right:0; bottom:0; height:150px; background:var(--tinte); }
.unten img { position:absolute; left:var(--rand); top:42px; height:66px; }
.unten .mono { position:absolute; right:var(--rand); top:62px; font-size:26px; color:var(--gruen-300); }
</style></head><body><div class="post">
  <img class="foto" src="beispiel-papier.png" alt="">
  <div class="notiz hand">gleich steht er auf!</div>
  <svg class="pfeil" width="150" height="130" viewBox="0 0 150 130" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"><path d="M140 10 C 110 40, 70 70, 20 110"/><path d="M20 110 L 55 104 M20 110 L 30 76"/></svg>
  <div class="unten"><img style="height:54px;width:auto" src="../../logos/logo-h-ohne-claim-negativ.png" alt="MakerSpace Bonn"><span class="mono">#MakerSpaceBonn</span></div>
</div></body></html>
