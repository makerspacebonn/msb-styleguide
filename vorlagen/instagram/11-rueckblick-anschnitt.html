<!doctype html><html lang="de"><head><meta charset="utf-8"><title>11 Rückblick (Anschnitt)</title>
<!-- Rückblick-Variante von 08-anschnitt. Abweichungen wie dort: übergroße, angeschnittene Schrift; Logo auf hängender Fahne. -->
<link rel="stylesheet" href="post.css">
<style>
.post { background:var(--gruen-500); }
.riese { position:absolute; left:44px; top:950px; font-size:250px; font-weight:700; letter-spacing:-.045em; line-height:1; color:var(--tinte); }
.bild { position:absolute; left:0; top:0; width:1080px; height:1000px; overflow:hidden; }
.bild img { object-position:45% 40%; }
.kasten { position:absolute; left:var(--rand); bottom:350px; background:var(--tinte); color:var(--weiss); padding:22px 30px 26px; }
.kasten .titel { font-size:80px; }
.kopf { position:absolute; left:var(--rand); top:var(--rand); }
.kopf .label { transform:rotate(-1.5deg); }
.fahne { position:absolute; right:var(--rand); top:0; width:190px; padding:76px 24px 24px; background:var(--weiss); }
.fahne img { width:100%; display:block; }
.info { position:absolute; left:var(--rand); right:var(--rand); bottom:var(--rand); display:flex; justify-content:space-between; font-size:26px; }
</style></head><body><div class="post">
  <div class="riese">Pop-up!</div>
  <div class="bild"><img class="foto" src="beispiel-papier.png" alt="Hände schneiden mit einem Cutter einen Papierkaktus für eine Pop-up-Karte aus"></div>
  <div class="kopf"><span class="label">Rückblick · So 15.11.</span></div>
  <div class="fahne"><img src="../../logos/logo-v-farbe.png" alt="MakerSpace Bonn"></div>
  <div class="kasten"><div class="titel">Paper Engineering</div></div>
  <div class="info mono"><span>Pop-up-Karten-Workshop</span><span>Danke fürs Mitmachen!</span></div>
</div></body></html>
